# MetaX INT8 expansion spaces.  The three sections intentionally keep
# independent tile families for the regular, swap and GEMV dispatches.
w8a8_block_int8_matmul:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        GROUP_M: group_m
      num_stages: stages
      num_warps: warps
    block_m:
      - 16
      - 32
      - 64
      - 128
    block_n:
      - 64
      - 128
      - 256
    group_m:
      - 4
      - 8
      - 16
    stages:
      - 2
      - 3
    warps:
      - 4
      - 8
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default
      SPLITS: default

w8a8_block_int8_swap:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        GROUP_M: group_m
      num_stages: stages
      num_warps: warps
    block_m:
      - 16
      - 32
      - 64
    block_n:
      - 16
      - 32
      - 64
      - 128
    group_m:
      - 4
      - 8
    stages:
      - 2
      - 3
    warps:
      - 4
      - 8
  - strategy:
      M: default
      N: default
      K: default
      GROUP_N: default
      GROUP_K: default
      SPLITS: default

w8a8_block_int8_gemv:
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
      num_stages: stages
      num_warps: warps
    block_n:
      - 64
      - 128
      - 256
      - 512
    block_k:
      - 64
      - 128
    stages:
      - 2
      - 3
    warps:
      - 4
      - 8
  - strategy:
      N: default
      K: default
